<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-label="Legacy uam.ps1 uitvoeringsflow">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <style>
    .title{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.subtitle{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#475569}
    .panel-title{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.box-title{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.box-title-small{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
    .box-meta{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#475569}.entity-field{font:400 13px Consolas,'Segoe UI',monospace;fill:#334155}
    .entity-key{font:700 13px Consolas,'Segoe UI',monospace;fill:#0f172a}.label{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#334155}
    .small{font:400 11px 'Segoe UI',Arial,sans-serif;fill:#64748b}.zone{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#1e293b}
  </style>
</defs>
<rect width="1500" height="1050" fill="#f8fafc"/>
<text x="40" y="48" class="title">Legacy uam.ps1 uitvoeringsflow</text>
<text x="40" y="76" text-anchor="start" class="subtitle">Samengevat uit 4.805 regels PowerShell; de flow verklaart de migratiegrenzen.</text>
<g filter="url(#shadow)"><rect x="470" y="110" width="560" height="82" rx="14" fill="#ffffff" stroke="#64748b"/><rect x="470" y="110" width="560" height="34" rx="14" fill="#dbeafe"/><rect x="470" y="134" width="560" height="10" fill="#dbeafe"/></g>
<text x="486" y="133" text-anchor="start" class="panel-title">1. Processtart en guards</text>
<text x="486" y="168" text-anchor="start" class="box-meta">Executable, elevation, single-instance en werksetlimieten</text>
<g filter="url(#shadow)"><rect x="470" y="220" width="560" height="82" rx="14" fill="#ffffff" stroke="#64748b"/><rect x="470" y="220" width="560" height="34" rx="14" fill="#dbeafe"/><rect x="470" y="244" width="560" height="10" fill="#dbeafe"/></g>
<text x="486" y="243" text-anchor="start" class="panel-title">2. Configuratie en connectie</text>
<text x="486" y="278" text-anchor="start" class="box-meta">dbsettings ontsleutelen, MSSQL testen, globale/user settings laden</text>
<g filter="url(#shadow)"><rect x="470" y="330" width="560" height="82" rx="14" fill="#ffffff" stroke="#64748b"/><rect x="470" y="330" width="560" height="34" rx="14" fill="#dbeafe"/><rect x="470" y="354" width="560" height="10" fill="#dbeafe"/></g>
<text x="486" y="353" text-anchor="start" class="panel-title">3. Herstel deferred buffer</text>
<text x="486" y="388" text-anchor="start" class="box-meta">SQL-statements uit CSV terug in geheugen halen</text>
<g filter="url(#shadow)"><rect x="470" y="440" width="560" height="82" rx="14" fill="#ffffff" stroke="#64748b"/><rect x="470" y="440" width="560" height="34" rx="14" fill="#dbeafe"/><rect x="470" y="464" width="560" height="10" fill="#dbeafe"/></g>
<text x="486" y="463" text-anchor="start" class="panel-title">4. Schedulerbesluit</text>
<text x="486" y="498" text-anchor="start" class="box-meta">Welke collectors zijn actief en zijn hun intervallen verlopen?</text>
<g filter="url(#shadow)"><rect x="80" y="585" width="380" height="82" rx="14" fill="#ffffff" stroke="#64748b"/><rect x="80" y="585" width="380" height="34" rx="14" fill="#dbeafe"/><rect x="80" y="609" width="380" height="10" fill="#dbeafe"/></g>
<text x="96" y="608" text-anchor="start" class="panel-title">Browserhistorie</text>
<text x="96" y="643" text-anchor="start" class="box-meta">Browserprofielen, tijdconversie, URL-data</text>
<g filter="url(#shadow)"><rect x="560" y="585" width="380" height="82" rx="14" fill="#ffffff" stroke="#64748b"/><rect x="560" y="585" width="380" height="34" rx="14" fill="#dbeafe"/><rect x="560" y="609" width="380" height="10" fill="#dbeafe"/></g>
<text x="576" y="608" text-anchor="start" class="panel-title">Recent / Quick Access</text>
<text x="576" y="643" text-anchor="start" class="box-meta">LNK/recent items, paden en bestandmetadata</text>
<g filter="url(#shadow)"><rect x="1040" y="585" width="380" height="82" rx="14" fill="#ffffff" stroke="#64748b"/><rect x="1040" y="585" width="380" height="34" rx="14" fill="#dbeafe"/><rect x="1040" y="609" width="380" height="10" fill="#dbeafe"/></g>
<text x="1056" y="608" text-anchor="start" class="panel-title">Windows-processen</text>
<text x="1056" y="643" text-anchor="start" class="box-meta">Procesnaam, pad, sessie en executable-metadata</text>
<g filter="url(#shadow)"><rect x="470" y="745" width="560" height="82" rx="14" fill="#ffffff" stroke="#64748b"/><rect x="470" y="745" width="560" height="34" rx="14" fill="#dbeafe"/><rect x="470" y="769" width="560" height="10" fill="#dbeafe"/></g>
<text x="486" y="768" text-anchor="start" class="panel-title">5. Opbouw writes en checkpoints</text>
<text x="486" y="803" text-anchor="start" class="box-meta">Detail-SQL, minimal log, errorcontext en nieuwe state</text>
<g filter="url(#shadow)"><rect x="470" y="855" width="560" height="82" rx="14" fill="#ffffff" stroke="#64748b"/><rect x="470" y="855" width="560" height="34" rx="14" fill="#dbeafe"/><rect x="470" y="879" width="560" height="10" fill="#dbeafe"/></g>
<text x="486" y="878" text-anchor="start" class="panel-title">6. Flush en lifecycle</text>
<text x="486" y="913" text-anchor="start" class="box-meta">CSV/in-memory buffer naar MSSQL, logrotatie, GC en self-restart</text>
<line x1="750" y1="192" x2="750" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="750" y1="302" x2="750" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="750" y1="412" x2="750" y2="440" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M650 522 C500 545 360 555 270 585" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="450" y="548" text-anchor="middle" class="small">actief/vervallen</text>
<line x1="750" y1="522" x2="750" y2="585" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="750" y="547" text-anchor="middle" class="small">actief/vervallen</text>
<path d="M850 522 C1000 545 1140 555 1230 585" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="1050" y="548" text-anchor="middle" class="small">actief/vervallen</text>
<path d="M270 667 C330 710 500 720 620 745" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="750" y1="667" x2="750" y2="745" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1230 667 C1170 710 1000 720 880 745" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="750" y1="827" x2="750" y2="855" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1030 900 C1370 900 1370 155 1030 155" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="1380" y="520" text-anchor="middle" class="small">wachten of self-restart</text>
<text x="40" y="1010" text-anchor="start" class="small">Migratiekern: behoud gedrag en checkpoints; vervang directe SQL, SQL-in-CSV, duplicaten en handmatige geheugensturing.</text>
</svg>
