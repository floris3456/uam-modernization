name: Validate UAM Plan Atlas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Bootstrap pinned repository-local D2
        run: node scripts/atlas.mjs bootstrap

      - name: Confirm generated Atlas is current and rejects unsafe states
        run: |
          node scripts/atlas.mjs check
          node scripts/atlas.mjs smoke-test
