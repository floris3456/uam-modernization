<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 500" role="img" aria-labelledby="gate-detail-title gate-detail-description" style="display:block;width:100%;height:100%"><title id="gate-detail-title">G5 proof flow</title><desc id="gate-detail-description">Human decision, allowed work, CLI evidence, pass and unlock, with a separate stop or hold path.</desc><defs><marker id="detail-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566273"/></marker><marker id="stop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b1e1e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><path d="M 260 135 L 300 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 520 135 L 560 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 780 135 L 820 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 1040 135 L 1080 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 930 215 L 930 300" fill="none" stroke="#8b1e1e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#stop-arrow)"/><text x="940" y="261" fill="#8b1e1e" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">If proof fails</text><a href="G5.html#main" tabindex="0" aria-label="G5 · Crash-safe device storage: Gate: open. Implementation: blocked. Depends on: G3, G4."><g><title>Gate: open. Implementation: blocked. Depends on: G3, G4.</title><clipPath id="detail-G5-start"><rect x="44" y="59" width="212" height="152" rx="7"/></clipPath><rect x="40" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="54" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G5-start)"><tspan x="54" font-size="17" font-weight="700">G5 · Crash-safe device</tspan><tspan x="54" dy="20" font-size="17" font-weight="700">storage</tspan><tspan x="54" dy="23" font-size="13">Gate: open. Implementation:</tspan><tspan x="54" dy="19" font-size="13">blocked. Depends on: G3, G4.</tspan></text></g></a><a href="G5.html#human-decisions" tabindex="0" aria-label="1. Humans decide: Approve durability, receipt, migration, and disk-pressure rules."><g><title>Approve durability, receipt, migration, and disk-pressure rules.</title><clipPath id="detail-G5-decision"><rect x="304" y="59" width="212" height="152" rx="7"/></clipPath><rect x="300" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="314" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G5-decision)"><tspan x="314" font-size="17" font-weight="700">1. Humans decide</tspan><tspan x="314" dy="27" font-size="13">Approve durability, receipt,</tspan><tspan x="314" dy="19" font-size="13">migration, and disk-pressure</tspan><tspan x="314" dy="19" font-size="13">rules.</tspan></text></g></a><a href="G5.html#allowed-work" tabindex="0" aria-label="2. Allowed work: Atomically store event effects and progress, then seal exact batches."><g><title>Atomically store event effects and progress, then seal exact batches.</title><clipPath id="detail-G5-work"><rect x="564" y="59" width="212" height="152" rx="7"/></clipPath><rect x="560" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="574" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G5-work)"><tspan x="574" font-size="17" font-weight="700">2. Allowed work</tspan><tspan x="574" dy="27" font-size="13">Atomically store event effects</tspan><tspan x="574" dy="19" font-size="13">and progress, then seal exact</tspan><tspan x="574" dy="19" font-size="13">batches.</tspan></text></g></a><a href="G5.html#cli-evidence" tabindex="0" aria-label="3. CLI proof: Crash every boundary and test replay, receipts, cleanup, and migration."><g><title>Crash every boundary and test replay, receipts, cleanup, and migration.</title><clipPath id="detail-G5-evidence"><rect x="824" y="59" width="212" height="152" rx="7"/></clipPath><rect x="820" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="834" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G5-evidence)"><tspan x="834" font-size="17" font-weight="700">3. CLI proof</tspan><tspan x="834" dy="27" font-size="13">Crash every boundary and test</tspan><tspan x="834" dy="19" font-size="13">replay, receipts, cleanup, and</tspan><tspan x="834" dy="19" font-size="13">migration.</tspan></text></g></a><a href="G5.html#pass-condition" tabindex="0" aria-label="4. Pass and unlock: Allow release, server, outage, and migration proof work."><g><title>Allow release, server, outage, and migration proof work.</title><clipPath id="detail-G5-success"><rect x="1084" y="59" width="212" height="152" rx="7"/></clipPath><rect x="1080" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="1094" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G5-success)"><tspan x="1094" font-size="17" font-weight="700">4. Pass and unlock</tspan><tspan x="1094" dy="27" font-size="13">Allow release, server, outage,</tspan><tspan x="1094" dy="19" font-size="13">and migration proof work.</tspan></text></g></a><a href="G5.html#stop-condition" tabindex="0" aria-label="Stop or hold: Stop for lost events, false progress, changed replay, or early cleanup."><g><title>Stop for lost events, false progress, changed replay, or early cleanup.</title><clipPath id="detail-G5-stop"><rect x="824" y="304" width="212" height="152" rx="7"/></clipPath><rect x="820" y="300" width="220" height="160" rx="10" fill="#fff2f2" stroke="#8b1e1e" stroke-width="2"/><text x="834" y="329" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G5-stop)"><tspan x="834" font-size="17" font-weight="700">Stop or hold</tspan><tspan x="834" dy="27" font-size="13">Stop for lost events, false</tspan><tspan x="834" dy="19" font-size="13">progress, changed replay, or</tspan><tspan x="834" dy="19" font-size="13">early cleanup.</tspan></text></g></a></svg>
