<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 500" role="img" aria-labelledby="gate-detail-title gate-detail-description" style="display:block;width:100%;height:100%"><title id="gate-detail-title">AG-15 proof flow</title><desc id="gate-detail-description">Human decision, allowed work, CLI evidence, pass and unlock, with a separate stop or hold path.</desc><defs><marker id="detail-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566273"/></marker><marker id="stop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b1e1e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><path d="M 260 135 L 300 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 520 135 L 560 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 780 135 L 820 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 1040 135 L 1080 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 930 215 L 930 300" fill="none" stroke="#8b1e1e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#stop-arrow)"/><text x="940" y="261" fill="#8b1e1e" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">If proof fails</text><a href="AG-15.html#main" tabindex="0" aria-label="AG-15 · Safe cutover and shutdown: Gate: open. Implementation: blocked. Depends on: AG-12, AG-13, AG-14."><g><title>Gate: open. Implementation: blocked. Depends on: AG-12, AG-13, AG-14.</title><clipPath id="detail-AG-15-start"><rect x="44" y="59" width="212" height="152" rx="7"/></clipPath><rect x="40" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="54" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-AG-15-start)"><tspan x="54" font-size="17" font-weight="700">AG-15 · Safe cutover</tspan><tspan x="54" dy="20" font-size="17" font-weight="700">and shutdown</tspan><tspan x="54" dy="23" font-size="13">Gate: open. Implementation:</tspan><tspan x="54" dy="19" font-size="13">blocked. Depends on: AG-12,</tspan><tspan x="54" dy="19" font-size="13">AG-13, AG-14.</tspan></text></g></a><a href="AG-15.html#human-decisions" tabindex="0" aria-label="1. Humans decide: Approve cutover fences, rollback limits, cleanup, and final acceptance."><g><title>Approve cutover fences, rollback limits, cleanup, and final acceptance.</title><clipPath id="detail-AG-15-decision"><rect x="304" y="59" width="212" height="152" rx="7"/></clipPath><rect x="300" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="314" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-AG-15-decision)"><tspan x="314" font-size="17" font-weight="700">1. Humans decide</tspan><tspan x="314" dy="27" font-size="13">Approve cutover fences,</tspan><tspan x="314" dy="19" font-size="13">rollback limits, cleanup, and</tspan><tspan x="314" dy="19" font-size="13">final acceptance.</tspan></text></g></a><a href="AG-15.html#allowed-work" tabindex="0" aria-label="2. Allowed work: Keep one writer, remove legacy trust in layers, and monitor residue."><g><title>Keep one writer, remove legacy trust in layers, and monitor residue.</title><clipPath id="detail-AG-15-work"><rect x="564" y="59" width="212" height="152" rx="7"/></clipPath><rect x="560" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="574" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-AG-15-work)"><tspan x="574" font-size="17" font-weight="700">2. Allowed work</tspan><tspan x="574" dy="27" font-size="13">Keep one writer, remove legacy</tspan><tspan x="574" dy="19" font-size="13">trust in layers, and monitor</tspan><tspan x="574" dy="19" font-size="13">residue.</tspan></text></g></a><a href="AG-15.html#cli-evidence" tabindex="0" aria-label="3. CLI proof: Test cutover, bounded rollback, credential removal, and residual attempts."><g><title>Test cutover, bounded rollback, credential removal, and residual attempts.</title><clipPath id="detail-AG-15-evidence"><rect x="824" y="59" width="212" height="152" rx="7"/></clipPath><rect x="820" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="834" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-AG-15-evidence)"><tspan x="834" font-size="17" font-weight="700">3. CLI proof</tspan><tspan x="834" dy="27" font-size="13">Test cutover, bounded</tspan><tspan x="834" dy="19" font-size="13">rollback, credential removal,</tspan><tspan x="834" dy="19" font-size="13">and residual attempts.</tspan></text></g></a><a href="AG-15.html#pass-condition" tabindex="0" aria-label="4. Pass and unlock: Decommission only after cleanup and independent human acceptance."><g><title>Decommission only after cleanup and independent human acceptance.</title><clipPath id="detail-AG-15-success"><rect x="1084" y="59" width="212" height="152" rx="7"/></clipPath><rect x="1080" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="1094" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-AG-15-success)"><tspan x="1094" font-size="17" font-weight="700">4. Pass and unlock</tspan><tspan x="1094" dy="27" font-size="13">Decommission only after</tspan><tspan x="1094" dy="19" font-size="13">cleanup and independent human</tspan><tspan x="1094" dy="19" font-size="13">acceptance.</tspan></text></g></a><a href="AG-15.html#stop-condition" tabindex="0" aria-label="Stop or hold: Stop for two writers, unsafe rollback, live legacy trust, or missing cleanup."><g><title>Stop for two writers, unsafe rollback, live legacy trust, or missing cleanup.</title><clipPath id="detail-AG-15-stop"><rect x="824" y="304" width="212" height="152" rx="7"/></clipPath><rect x="820" y="300" width="220" height="160" rx="10" fill="#fff2f2" stroke="#8b1e1e" stroke-width="2"/><text x="834" y="329" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-AG-15-stop)"><tspan x="834" font-size="17" font-weight="700">Stop or hold</tspan><tspan x="834" dy="27" font-size="13">Stop for two writers, unsafe</tspan><tspan x="834" dy="19" font-size="13">rollback, live legacy trust,</tspan><tspan x="834" dy="19" font-size="13">or missing cleanup.</tspan></text></g></a></svg>
