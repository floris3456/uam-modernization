<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 500" role="img" aria-labelledby="gate-detail-title gate-detail-description" style="display:block;width:100%;height:100%"><title id="gate-detail-title">G0 proof flow</title><desc id="gate-detail-description">Human decision, allowed work, CLI evidence, pass and unlock, with a separate stop or hold path.</desc><defs><marker id="detail-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566273"/></marker><marker id="stop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b1e1e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><path d="M 260 135 L 300 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 520 135 L 560 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 780 135 L 820 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 1040 135 L 1080 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 930 215 L 930 300" fill="none" stroke="#8b1e1e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#stop-arrow)"/><text x="940" y="261" fill="#8b1e1e" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">If proof fails</text><a href="G0.html#main" tabindex="0" aria-label="G0 · Fictional test foundation: Gate: open. Implementation: not-started. Depends on: none."><g><title>Gate: open. Implementation: not-started. Depends on: none.</title><clipPath id="detail-G0-start"><rect x="44" y="59" width="212" height="152" rx="7"/></clipPath><rect x="40" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="54" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G0-start)"><tspan x="54" font-size="17" font-weight="700">G0 · Fictional test</tspan><tspan x="54" dy="20" font-size="17" font-weight="700">foundation</tspan><tspan x="54" dy="23" font-size="13">Gate: open. Implementation:</tspan><tspan x="54" dy="19" font-size="13">not-started. Depends on: none.</tspan></text></g></a><a href="G0.html#human-decisions" tabindex="0" aria-label="1. Humans decide: Name reviewers and confirm privacy rules, contracts, and experiments."><g><title>Name reviewers and confirm privacy rules, contracts, and experiments.</title><clipPath id="detail-G0-decision"><rect x="304" y="59" width="212" height="152" rx="7"/></clipPath><rect x="300" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="314" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G0-decision)"><tspan x="314" font-size="17" font-weight="700">1. Humans decide</tspan><tspan x="314" dy="27" font-size="13">Name reviewers and confirm</tspan><tspan x="314" dy="19" font-size="13">privacy rules, contracts, and</tspan><tspan x="314" dy="19" font-size="13">experiments.</tspan></text></g></a><a href="G0.html#allowed-work" tabindex="0" aria-label="2. Allowed work: Build fictional data, strict contracts, and an independent checker."><g><title>Build fictional data, strict contracts, and an independent checker.</title><clipPath id="detail-G0-work"><rect x="564" y="59" width="212" height="152" rx="7"/></clipPath><rect x="560" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="574" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G0-work)"><tspan x="574" font-size="17" font-weight="700">2. Allowed work</tspan><tspan x="574" dy="27" font-size="13">Build fictional data, strict</tspan><tspan x="574" dy="19" font-size="13">contracts, and an independent</tspan><tspan x="574" dy="19" font-size="13">checker.</tspan></text></g></a><a href="G0.html#cli-evidence" tabindex="0" aria-label="3. CLI proof: Repeat generation, mutations, canary scans, cleanup, and hash checks."><g><title>Repeat generation, mutations, canary scans, cleanup, and hash checks.</title><clipPath id="detail-G0-evidence"><rect x="824" y="59" width="212" height="152" rx="7"/></clipPath><rect x="820" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="834" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G0-evidence)"><tspan x="834" font-size="17" font-weight="700">3. CLI proof</tspan><tspan x="834" dy="27" font-size="13">Repeat generation, mutations,</tspan><tspan x="834" dy="19" font-size="13">canary scans, cleanup, and</tspan><tspan x="834" dy="19" font-size="13">hash checks.</tspan></text></g></a><a href="G0.html#pass-condition" tabindex="0" aria-label="4. Pass and unlock: Allow synthetic endpoint foundations, but never live data."><g><title>Allow synthetic endpoint foundations, but never live data.</title><clipPath id="detail-G0-success"><rect x="1084" y="59" width="212" height="152" rx="7"/></clipPath><rect x="1080" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="1094" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G0-success)"><tspan x="1094" font-size="17" font-weight="700">4. Pass and unlock</tspan><tspan x="1094" dy="27" font-size="13">Allow synthetic endpoint</tspan><tspan x="1094" dy="19" font-size="13">foundations, but never live</tspan><tspan x="1094" dy="19" font-size="13">data.</tspan></text></g></a><a href="G0.html#stop-condition" tabindex="0" aria-label="Stop or hold: Stop for real data, unstable results, missed canaries, coupling, or residue."><g><title>Stop for real data, unstable results, missed canaries, coupling, or residue.</title><clipPath id="detail-G0-stop"><rect x="824" y="304" width="212" height="152" rx="7"/></clipPa