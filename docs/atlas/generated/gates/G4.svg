<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 500" role="img" aria-labelledby="gate-detail-title gate-detail-description" style="display:block;width:100%;height:100%"><title id="gate-detail-title">G4 proof flow</title><desc id="gate-detail-description">Human decision, allowed work, CLI evidence, pass and unlock, with a separate stop or hold path.</desc><defs><marker id="detail-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566273"/></marker><marker id="stop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b1e1e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><path d="M 260 135 L 300 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 520 135 L 560 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 780 135 L 820 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 1040 135 L 1080 135" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#detail-arrow)"/><path d="M 930 215 L 930 300" fill="none" stroke="#8b1e1e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#stop-arrow)"/><text x="940" y="261" fill="#8b1e1e" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">If proof fails</text><a href="G4.html#main" tabindex="0" aria-label="G4 · Privacy protection: Gate: open. Implementation: blocked. Depends on: G0, G2."><g><title>Gate: open. Implementation: blocked. Depends on: G0, G2.</title><clipPath id="detail-G4-start"><rect x="44" y="59" width="212" height="152" rx="7"/></clipPath><rect x="40" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="54" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G4-start)"><tspan x="54" font-size="17" font-weight="700">G4 · Privacy</tspan><tspan x="54" dy="20" font-size="17" font-weight="700">protection</tspan><tspan x="54" dy="23" font-size="13">Gate: open. Implementation:</tspan><tspan x="54" dy="19" font-size="13">blocked. Depends on: G0, G2.</tspan></text></g></a><a href="G4.html#human-decisions" tabindex="0" aria-label="1. Humans decide: Approve the privacy ceiling and application matching rules."><g><title>Approve the privacy ceiling and application matching rules.</title><clipPath id="detail-G4-decision"><rect x="304" y="59" width="212" height="152" rx="7"/></clipPath><rect x="300" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="314" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G4-decision)"><tspan x="314" font-size="17" font-weight="700">1. Humans decide</tspan><tspan x="314" dy="27" font-size="13">Approve the privacy ceiling</tspan><tspan x="314" dy="19" font-size="13">and application matching</tspan><tspan x="314" dy="19" font-size="13">rules.</tspan></text></g></a><a href="G4.html#allowed-work" tabindex="0" aria-label="2. Allowed work: Match applications and transform URLs before crossing the boundary."><g><title>Match applications and transform URLs before crossing the boundary.</title><clipPath id="detail-G4-work"><rect x="564" y="59" width="212" height="152" rx="7"/></clipPath><rect x="560" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="574" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G4-work)"><tspan x="574" font-size="17" font-weight="700">2. Allowed work</tspan><tspan x="574" dy="27" font-size="13">Match applications and</tspan><tspan x="574" dy="19" font-size="13">transform URLs before crossing</tspan><tspan x="574" dy="19" font-size="13">the boundary.</tspan></text></g></a><a href="G4.html#cli-evidence" tabindex="0" aria-label="3. CLI proof: Run canaries, realm tests, matching vectors, and sink scans."><g><title>Run canaries, realm tests, matching vectors, and sink scans.</title><clipPath id="detail-G4-evidence"><rect x="824" y="59" width="212" height="152" rx="7"/></clipPath><rect x="820" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="834" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G4-evidence)"><tspan x="834" font-size="17" font-weight="700">3. CLI proof</tspan><tspan x="834" dy="27" font-size="13">Run canaries, realm tests,</tspan><tspan x="834" dy="19" font-size="13">matching vectors, and sink</tspan><tspan x="834" dy="19" font-size="13">scans.</tspan></text></g></a><a href="G4.html#pass-condition" tabindex="0" aria-label="4. Pass and unlock: Allow only transformed events into the crash-safe outbox."><g><title>Allow only transformed events into the crash-safe outbox.</title><clipPath id="detail-G4-success"><rect x="1084" y="59" width="212" height="152" rx="7"/></clipPath><rect x="1080" y="55" width="220" height="160" rx="10" fill="#f5f7fa" stroke="#566273" stroke-width="2"/><text x="1094" y="84" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G4-success)"><tspan x="1094" font-size="17" font-weight="700">4. Pass and unlock</tspan><tspan x="1094" dy="27" font-size="13">Allow only transformed events</tspan><tspan x="1094" dy="19" font-size="13">into the crash-safe outbox.</tspan></text></g></a><a href="G4.html#stop-condition" tabindex="0" aria-label="Stop or hold: Stop for raw leakage, wrong matches, realm mixing, or missed canaries."><g><title>Stop for raw leakage, wrong matches, realm mixing, or missed canaries.</title><clipPath id="detail-G4-stop"><rect x="824" y="304" width="212" height="152" rx="7"/></clipPath><rect x="820" y="300" width="220" height="160" rx="10" fill="#fff2f2" stroke="#8b1e1e" stroke-width="2"/><text x="834" y="329" fill="#17202a" font-family="system-ui,Segoe UI,sans-serif" clip-path="url(#detail-G4-stop)"><tspan x="834" font-size="17" font-weight="700">Stop or hold</tspan><tspan x="834" dy="27" font-size="13">Stop for raw leakage, wrong</tspan><tspan x="834" dy="19" font-size="13">matches, realm mixing, or</tspan><tspan x="834" dy="19" font-size="13">missed canaries.</tspan></text></g></a></svg>
